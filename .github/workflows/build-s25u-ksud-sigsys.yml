name: Build S25U ksud SIGSYS hotfix

on:
  push:
    branches:
      - fix/ksud-sigsys
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build patched ksud
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout app fork
        uses: actions/checkout@v4

      - name: Set up Android NDK r29
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Fetch pinned KernelSU and Samsung payload sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/tiann/KernelSU.git KernelSU
          git -C KernelSU checkout b0bc817b4e966aa6aa830834eaf6ef765d821d40
          git clone --depth=1 https://github.com/BuSung-dev/Root-My-Galaxy-Payloads.git Payloads

      - name: Apply Samsung KDP/RKP/DEFEX patch
        shell: bash
        run: |
          set -euo pipefail
          git -C KernelSU apply --check "$GITHUB_WORKSPACE/Payloads/kernelsu/patches/KernelSU-v3.2.5-samsung-kdp-rkp-defex.patch"
          git -C KernelSU apply "$GITHUB_WORKSPACE/Payloads/kernelsu/patches/KernelSU-v3.2.5-samsung-kdp-rkp-defex.patch"

      - name: Backport upstream ksud SIGSYS handler
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          root = Path("KernelSU")
          cli = root / "userspace/ksud/src/cli.rs"
          calls = root / "userspace/ksud/src/ksucalls.rs"

          s = cli.read_text()
          needle = '''    android_logger::init_once(
              Config::default()
                  .with_max_level(crate::debug_select!(LevelFilter::Trace, LevelFilter::Info))
                  .with_tag("KernelSU"),
          );
          '''
          replacement = needle + '''
              // Backport of tiann/KernelSU 35feb588: survive Samsung seccomp
              // trapping the legacy magic reboot syscall used for driver-fd discovery.
              ksucalls::setup_sigsys_handler();
          '''
          if needle not in s:
              raise SystemExit("cli.rs insertion point not found")
          cli.write_text(s.replace(needle, replacement, 1))

          s = calls.read_text()
          old_import = '''use crate::ksu_uapi;
          use std::fs;
          '''
          new_import = '''use crate::ksu_uapi;
          use std::cell::Cell;
          use std::fs;
          '''
          if old_import not in s:
              raise SystemExit("ksucalls.rs import insertion point not found")
          s = s.replace(old_import, new_import, 1)

          marker = '''// Global driver fd cache
          '''
          handler = r'''// Backport of tiann/KernelSU commit 35feb58872b6f88ac1b488ce46a68892a017d62d.
          // Samsung/Android seccomp may return SIGSYS (SYS_SECCOMP) for the legacy
          // magic reboot syscall. Convert only an in-flight KernelSU SVC probe into
          // -EPERM instead of letting the process die.
          std::thread_local! {
              static SVC_IN_FLIGHT: Cell<bool> = const { Cell::new(false) };
              static SIGSYS_OCCURRED: Cell<bool> = const { Cell::new(false) };
          }

          const SYS_SECCOMP: libc::c_int = 1;

          fn with_svc_call<F, R>(call: F) -> R
          where
              F: FnOnce() -> R,
          {
              SVC_IN_FLIGHT.with(|in_flight| in_flight.set(true));
              let result = call();
              SVC_IN_FLIGHT.with(|in_flight| in_flight.set(false));
              result
          }

          fn take_sigsys_occurred() -> bool {
              SIGSYS_OCCURRED.with(|occurred| occurred.replace(false))
          }

          extern "C" fn sigsys_handler(
              _sig: libc::c_int,
              info: *mut libc::siginfo_t,
              ctx: *mut libc::c_void,
          ) {
              unsafe {
                  if info.is_null() || ctx.is_null() || (*info).si_code != SYS_SECCOMP {
                      return;
                  }
                  if SVC_IN_FLIGHT.with(Cell::get) {
                      SIGSYS_OCCURRED.with(|occurred| occurred.set(true));
                  }

                  let ucontext = ctx.cast::<libc::ucontext_t>();
                  #[cfg(target_arch = "aarch64")]
                  {
                      (*ucontext).uc_mcontext.regs[0] = (-libc::EPERM) as u64;
                  }
                  #[cfg(target_arch = "x86_64")]
                  {
                      let rax = libc::REG_RAX as usize;
                      (*ucontext).uc_mcontext.gregs[rax] = i64::from(-libc::EPERM);
                  }
              }
          }

          pub fn setup_sigsys_handler() {
              unsafe {
                  let mut sa: libc::sigaction = std::mem::zeroed();
                  sa.sa_flags = libc::SA_SIGINFO;
                  sa.sa_sigaction = sigsys_handler as *const () as usize;
                  libc::sigemptyset(std::ptr::addr_of_mut!(sa.sa_mask));
                  if libc::sigaction(libc::SIGSYS, std::ptr::addr_of!(sa), std::ptr::null_mut()) != 0 {
                      let error = std::io::Error::last_os_error();
                      log::warn!("Failed to set SIGSYS handler: {error}");
                  }
              }
          }

          '''
          if marker not in s:
              raise SystemExit("ksucalls.rs handler insertion point not found")
          s = s.replace(marker, handler + marker, 1)

          old_call = '''        unsafe {
                      libc::syscall(
                          libc::SYS_reboot,
                          ksu_uapi::KSU_INSTALL_MAGIC1,
                          ksu_uapi::KSU_INSTALL_MAGIC2,
                          0,
                          &mut fd,
                      );
                  };
          '''
          new_call = '''        with_svc_call(|| unsafe {
                      libc::syscall(
                          libc::SYS_reboot,
                          ksu_uapi::KSU_INSTALL_MAGIC1,
                          ksu_uapi::KSU_INSTALL_MAGIC2,
                          0,
                          &mut fd,
                      )
                  });
                  if take_sigsys_occurred() {
                      eprintln!("KernelSU driver install syscall was blocked by seccomp");
                      log::error!("KernelSU driver install syscall was blocked by seccomp");
                  }
          '''
          if old_call not in s:
              raise SystemExit("ksucalls.rs SVC call insertion point not found")
          calls.write_text(s.replace(old_call, new_call, 1))
          PY

          grep -n "setup_sigsys_handler" KernelSU/userspace/ksud/src/{cli.rs,ksucalls.rs}

      - name: Embed the known S25U Samsung-patched android15-6.6 module
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p KernelSU/userspace/ksud/bin/aarch64
          cp Payloads/kernelsu/android15-6.6_kernelsu-s25u-kdp.ko \
             KernelSU/userspace/ksud/bin/aarch64/android15-6.6_kernelsu.ko
          sha256sum Payloads/kernelsu/android15-6.6_kernelsu-s25u-kdp.ko \
                    KernelSU/userspace/ksud/bin/aarch64/android15-6.6_kernelsu.ko

      - name: Build aarch64 ksud
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          cd KernelSU
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 35
          cargo build --release --target aarch64-linux-android -p ksud --locked

      - name: Verify hotfix binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp KernelSU/target/aarch64-linux-android/release/ksud out/ksud-s25u-kdp-sigsys-hotfix
          test -s out/ksud-s25u-kdp-sigsys-hotfix
          file out/ksud-s25u-kdp-sigsys-hotfix
          grep -a -q "KernelSU driver install syscall was blocked by seccomp" out/ksud-s25u-kdp-sigsys-hotfix
          sha256sum out/ksud-s25u-kdp-sigsys-hotfix | tee out/SHA256SUMS.txt
          printf '%s\n' \
            'KernelSU base: b0bc817b4e966aa6aa830834eaf6ef765d821d40 (v3.2.5)' \
            'SIGSYS backport: 35feb58872b6f88ac1b488ce46a68892a017d62d' \
            'Embedded module: BuSung-dev/Root-My-Galaxy-Payloads kernelsu/android15-6.6_kernelsu-s25u-kdp.ko' \
            > out/BUILD_INFO.txt

      - name: Upload hotfix
        uses: actions/upload-artifact@v4
        with:
          name: ksud-s25u-kdp-sigsys-hotfix
          path: out/
          if-no-files-found: error
          retention-days: 14
