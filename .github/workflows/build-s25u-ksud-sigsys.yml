name: Build S25U ksud SIGSYS hotfix

on:
  push:
    branches:
      - fix/ksud-sigsys
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build patched ksud and APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout app fork
        uses: actions/checkout@v4

      - name: Set up Android NDK r29
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Fetch pinned KernelSU and Samsung payload sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/tiann/KernelSU.git KernelSU
          git -C KernelSU checkout b0bc817b4e966aa6aa830834eaf6ef765d821d40
          git clone --depth=1 https://github.com/BuSung-dev/Root-My-Galaxy-Payloads.git Payloads

      - name: Apply Samsung KDP/RKP/DEFEX patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/Payloads/kernelsu/patches/KernelSU-v3.2.5-samsung-kdp-rkp-defex.patch"
          git -C KernelSU apply --check "$PATCH"
          git -C KernelSU apply "$PATCH"

      - name: Backport upstream ksud SIGSYS handler
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/backport_ksud_sigsys.py KernelSU
          grep -n "setup_sigsys_handler" KernelSU/userspace/ksud/src/{cli.rs,ksucalls.rs}
          grep -n "with_svc_call" KernelSU/userspace/ksud/src/ksucalls.rs

      - name: Embed known Samsung-patched android15-6.6 module
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p KernelSU/userspace/ksud/bin/aarch64
          cp Payloads/kernelsu/android15-6.6_kernelsu-s25u-kdp.ko \
             KernelSU/userspace/ksud/bin/aarch64/android15-6.6_kernelsu.ko
          cmp Payloads/kernelsu/android15-6.6_kernelsu-s25u-kdp.ko \
              KernelSU/userspace/ksud/bin/aarch64/android15-6.6_kernelsu.ko
          sha256sum KernelSU/userspace/ksud/bin/aarch64/android15-6.6_kernelsu.ko

      - name: Build aarch64 ksud
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          set -euo pipefail
          git config --global url."https://github.com/KernelSU2/".insteadOf "https://github.com/Kernel-SU/"
          cd KernelSU
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 35
          cargo build --release --target aarch64-linux-android -p ksud --locked

      - name: Verify hotfix binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp KernelSU/target/aarch64-linux-android/release/ksud out/ksud-s25u-kdp-sigsys-hotfix
          test -s out/ksud-s25u-kdp-sigsys-hotfix
          file out/ksud-s25u-kdp-sigsys-hotfix
          grep -a -q "KernelSU driver install syscall was blocked by seccomp" out/ksud-s25u-kdp-sigsys-hotfix
          sha256sum out/ksud-s25u-kdp-sigsys-hotfix | tee out/SHA256SUMS.txt
          printf '%s\n' \
            'KernelSU base: b0bc817b4e966aa6aa830834eaf6ef765d821d40 (v3.2.5)' \
            'SIGSYS backport: 35feb58872b6f88ac1b488ce46a68892a017d62d' \
            'Embedded module: BuSung-dev/Root-My-Galaxy-Payloads/kernelsu/android15-6.6_kernelsu-s25u-kdp.ko' \
            > out/BUILD_INFO.txt

      - name: Upload hotfix binary early
        uses: actions/upload-artifact@v4
        with:
          name: ksud-s25u-kdp-sigsys-hotfix
          path: |
            out/ksud-s25u-kdp-sigsys-hotfix
            out/BUILD_INFO.txt
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Bundle patched ksud into app assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cp out/ksud-s25u-kdp-sigsys-hotfix app/src/main/assets/ksud-s25u-kdp
          cmp out/ksud-s25u-kdp-sigsys-hotfix app/src/main/assets/ksud-s25u-kdp

      - name: Repair inherited InstallViewModel shell literal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt")
          text = path.read_text()
          old_echo = '''            echo "[ksu-prep] kptr_restrict=$value"'''
          new_echo = '''            echo "[ksu-prep] kptr_restrict=${'$'}value"'''
          old_test = '''            [ "$value" = "1" ] || exit 43'''
          new_test = '''            [ "${'$'}value" = "1" ] || exit 43'''
          if text.count(old_echo) != 1 or text.count(old_test) != 1:
              raise SystemExit("unexpected InstallViewModel kptr shell block")
          text = text.replace(old_echo, new_echo, 1).replace(old_test, new_test, 1)
          path.write_text(text)
          PY
          grep -n 'kptr_restrict' app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt | tail -n 3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 cmake;3.22.1'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK with bundled patched ksud
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --no-daemon
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n1)
          test -n "$APK"
          unzip -l "$APK" | grep -q 'assets/ksud-s25u-kdp'
          cp "$APK" out/RootMyGalaxy-S25U-SIGSYS-hotfix.apk
          sha256sum out/RootMyGalaxy-S25U-SIGSYS-hotfix.apk >> out/SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RootMyGalaxy-S25U-SIGSYS-hotfix-apk
          path: out/RootMyGalaxy-S25U-SIGSYS-hotfix.apk
          if-no-files-found: error
          retention-days: 14
