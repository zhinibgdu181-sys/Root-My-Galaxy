name: Patch S9360 late-load diagnostics

on:
  push:
    branches: ["fix/s9360-late-load-diagnostics"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/s9360-late-load-diagnostics
      - name: Apply patch
        run: python3 .github/scripts/patch_s9360_lateload.py
      - name: Commit when changed
        shell: bash
        run: |
          if git diff --quiet -- app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt app/build.gradle.kts; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt app/build.gradle.kts
          git diff --cached --check
          git commit -m "Fix S9360 late-load diagnostics"
          git push origin HEAD:fix/s9360-late-load-diagnostics
