name: Publish RootFix1 APK

on:
  push:
    branches:
      - fix/s9360-ksu330-rescue-postload
    paths:
      - '.github/workflows/release-rootfix1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-rootfix1
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: v0.2.70-s9360-rootfix1
      APK_NAME: Root-My-Galaxy-S9360-rootfix1.apk
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 cmake;3.22.1'
          accept-android-sdk-licenses: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK asset
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"

      - name: Publish GitHub release
        run: |
          NOTES_FILE=release-notes.md
          cat > "$NOTES_FILE" <<'EOF'
          Root My Galaxy S9360 RootFix1 APK.

          Changes:
          - Keeps the home-screen update-card removal.
          - Keeps rescue mode pre/post KernelSU module disable verification.
          - Keeps Samsung bootstrap mount-namespace normalization.
          - Restores the stable upstream payload source instead of pinning the KernelSU 3.3.0 candidate payload set.

          Test focus:
          - Confirm bootstrap root no longer fails at F_SETPIPE_SZ / pipe page child did not report base.
          - If root succeeds, continue with SELinux detection work in a separate build.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" "$APK_NAME.sha256" --clobber
          else
            gh release create "$TAG" "$APK_NAME" "$APK_NAME.sha256" \
              --title "Root My Galaxy $TAG" \
              --notes-file "$NOTES_FILE" \
              --target "$GITHUB_SHA" \
              --prerelease
          fi
